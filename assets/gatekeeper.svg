<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="50%" style="stop-color:#C8C8C8"/>
      <stop offset="100%" style="stop-color:#A0A0A0"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4D4D4"/>
      <stop offset="100%" style="stop-color:#B0B0B0"/>
    </linearGradient>
    <radialGradient id="eyeCore" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#AADDFF"/>
      <stop offset="30%" style="stop-color:#44AAFF"/>
      <stop offset="70%" style="stop-color:#0055CC"/>
      <stop offset="100%" style="stop-color:#001166"/>
    </radialGradient>
    <radialGradient id="antennaBall" cx="40%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#88CCFF"/>
      <stop offset="50%" style="stop-color:#0077FF"/>
      <stop offset="100%" style="stop-color:#0033AA"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="193" rx="55" ry="7" fill="rgba(0,0,0,0.2)"/>

  <!-- Body/chest -->
  <rect x="28" y="150" width="144" height="40" rx="14" fill="url(#bodyGrad)" stroke="#909090" stroke-width="1.5"/>
  <!-- Chest panel -->
  <rect x="42" y="158" width="116" height="24" rx="6" fill="url(#plateGrad)" stroke="#888" stroke-width="1"/>
  <!-- Chest LEDs -->
  <circle cx="57" cy="170" r="4" fill="#00AAFF" filter="url(#softglow)" opacity="0.9"/>
  <circle cx="72" cy="170" r="4" fill="#0066FF" filter="url(#softglow)" opacity="0.7"/>
  <circle cx="87" cy="170" r="4" fill="#0044CC" opacity="0.5"/>
  <!-- Chest label -->
  <text x="130" y="174" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#00BBFF" letter-spacing="1">GATEKEEPER</text>

  <!-- Neck -->
  <rect x="82" y="136" width="36" height="18" rx="5" fill="url(#bodyGrad)" stroke="#909090" stroke-width="1.5"/>
  <line x1="90" y1="140" x2="90" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="100" y1="140" x2="100" y2="150" stroke="#888" stroke-width="1.5"/>
  <line x1="110" y1="140" x2="110" y2="150" stroke="#888" stroke-width="1.5"/>

  <!-- Head -->
  <rect x="22" y="32" width="156" height="108" rx="18" fill="url(#bodyGrad)" stroke="#999" stroke-width="2"/>
  <!-- Head highlight -->
  <rect x="28" y="38" width="70" height="28" rx="10" fill="rgba(255,255,255,0.18)"/>

  <!-- Ear panels - left -->
  <rect x="10" y="60" width="14" height="50" rx="6" fill="#C0C0C0" stroke="#909090" stroke-width="1.5"/>
  <rect x="13" y="67" width="6" height="6" rx="2" fill="#00AAFF" filter="url(#softglow)" opacity="0.9"/>
  <rect x="13" y="78" width="6" height="6" rx="2" fill="#0088FF" opacity="0.6"/>
  <rect x="13" y="89" width="6" height="6" rx="2" fill="#0066FF" opacity="0.4"/>
  <rect x="13" y="100" width="6" height="4" rx="2" fill="#004488" opacity="0.3"/>

  <!-- Ear panels - right -->
  <rect x="176" y="60" width="14" height="50" rx="6" fill="#C0C0C0" stroke="#909090" stroke-width="1.5"/>
  <rect x="181" y="67" width="6" height="6" rx="2" fill="#00AAFF" filter="url(#softglow)" opacity="0.9"/>
  <rect x="181" y="78" width="6" height="6" rx="2" fill="#0088FF" opacity="0.6"/>
  <rect x="181" y="89" width="6" height="6" rx="2" fill="#0066FF" opacity="0.4"/>
  <rect x="181" y="100" width="6" height="4" rx="2" fill="#004488" opacity="0.3"/>

  <!-- Antenna base -->
  <rect x="88" y="22" width="24" height="14" rx="4" fill="#BBBBBB" stroke="#999" stroke-width="1.5"/>
  <!-- Antenna stem -->
  <rect x="96" y="4" width="8" height="20" rx="4" fill="#AAAAAA" stroke="#999" stroke-width="1"/>
  <!-- Antenna ball - blue LED with glow -->
  <circle cx="100" cy="5" r="10" fill="#0055FF" filter="url(#glow)" opacity="0.5"/>
  <circle cx="100" cy="5" r="7" fill="url(#antennaBall)"/>
  <circle cx="97" cy="3" r="2.5" fill="white" opacity="0.5"/>

  <!-- Forehead visor -->
  <rect x="36" y="44" width="128" height="22" rx="8" fill="#BBBBBB" stroke="#999" stroke-width="1"/>
  <!-- Circuit traces on visor -->
  <line x1="48" y1="54" x2="68" y2="54" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="54" x2="68" y2="48" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="48" x2="82" y2="48" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="83" cy="48" r="2.5" fill="#00AAFF" filter="url(#softglow)"/>
  <line x1="118" y1="48" x2="132" y2="48" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="132" y1="48" x2="132" y2="54" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="132" y1="54" x2="152" y2="54" stroke="#777" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="117" cy="48" r="2.5" fill="#00AAFF" filter="url(#softglow)"/>

  <!-- Left eye socket -->
  <ellipse cx="72" cy="90" rx="24" ry="20" fill="#1a1a2e" stroke="#445588" stroke-width="1.5"/>
  <!-- Left eye glow -->
  <ellipse cx="72" cy="90" rx="20" ry="16" fill="#001166" filter="url(#glow)" opacity="0.8"/>
  <!-- Left eye iris -->
  <ellipse cx="72" cy="90" rx="18" ry="14" fill="url(#eyeCore)"/>
  <!-- Left eye pupil -->
  <ellipse cx="72" cy="90" rx="8" ry="7" fill="#CCEEFF"/>
  <ellipse cx="72" cy="90" rx="4" ry="4" fill="white" opacity="0.95"/>
  <!-- Left eye specular -->
  <ellipse cx="67" cy="85" rx="4" ry="3" fill="white" opacity="0.5"/>
  <ellipse cx="68" cy="86" rx="2" ry="1.5" fill="white" opacity="0.8"/>

  <!-- Right eye socket -->
  <ellipse cx="128" cy="90" rx="24" ry="20" fill="#1a1a2e" stroke="#445588" stroke-width="1.5"/>
  <!-- Right eye glow -->
  <ellipse cx="128" cy="90" rx="20" ry="16" fill="#001166" filter="url(#glow)" opacity="0.8"/>
  <!-- Right eye iris -->
  <ellipse cx="128" cy="90" rx="18" ry="14" fill="url(#eyeCore)"/>
  <!-- Right eye pupil -->
  <ellipse cx="128" cy="90" rx="8" ry="7" fill="#CCEEFF"/>
  <ellipse cx="128" cy="90" rx="4" ry="4" fill="white" opacity="0.95"/>
  <!-- Right eye specular -->
  <ellipse cx="123" cy="85" rx="4" ry="3" fill="white" opacity="0.5"/>
  <ellipse cx="124" cy="86" rx="2" ry="1.5" fill="white" opacity="0.8"/>

  <!-- Nose indicator -->
  <circle cx="100" cy="113" r="5" fill="#003388" stroke="#0055AA" stroke-width="1"/>
  <circle cx="100" cy="113" r="3" fill="#0066FF" filter="url(#softglow)" opacity="0.8"/>

  <!-- Mouth panel -->
  <rect x="50" y="122" width="100" height="14" rx="7" fill="#888" stroke="#777" stroke-width="1"/>
  <rect x="54" y="125" width="8" height="8" rx="2" fill="#00CCFF" filter="url(#softglow)" opacity="0.9"/>
  <rect x="66" y="125" width="8" height="8" rx="2" fill="#00AAFF" opacity="0.8"/>
  <rect x="78" y="125" width="8" height="8" rx="2" fill="#0088FF" opacity="0.6"/>
  <rect x="90" y="125" width="8" height="8" rx="2" fill="#0066FF" opacity="0.5"/>
  <rect x="102" y="125" width="8" height="8" rx="2" fill="#0088FF" opacity="0.6"/>
  <rect x="114" y="125" width="8" height="8" rx="2" fill="#00AAFF" opacity="0.8"/>
  <rect x="126" y="125" width="8" height="8" rx="2" fill="#00CCFF" filter="url(#softglow)" opacity="0.9"/>
  <rect x="138" y="125" width="8" height="8" rx="2" fill="#0099FF" opacity="0.5"/>
</svg>
